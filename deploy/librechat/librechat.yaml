version: "1.3.19"
endpoints:
  custom:
    - name: Prompt Airlock
      apiKey: '${PROMPT_AIRLOCK_TOKEN}'
      baseURL: 'https://127.0.0.1:18743/v1'
      models:
        default:
          - prompt-airlock
        fetch: false
      titleConvo: false
      dropParams:
        - stream
        - user
        - frequency_penalty
        - presence_penalty
      addParams:
        maxRetries: 0
fileConfig:
  endpoints:
    custom:
      defaultLLMDeliveryPath:
        fallback: provider