name: Publication policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [Publication request]
    types: [completed]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # 저장소 전체 점검은 하루 한 번. PR 병합 여부는 PR 이벤트가 그 PR 내용만 보고 정한다.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# PR 마다 따로 돌고, 같은 PR 에 새 커밋이 오면 이전 검사를 취소한다. 다른 이벤트는 서로 기다리지 않는다.
concurrency:
  group: publication-policy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve trusted default branch
        id: trusted
        shell: bash
        run: |
          set -euo pipefail
          # PR 이벤트일 때만 그 PR head 의 이전 결과를 먼저 무효화한다. 다른 PR 의 status 는 건드리지 않는다.
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]] && [[ "$(jq -r .action "$GITHUB_EVENT_PATH")" != closed ]]; then
            head=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/$GH_REPO/statuses/$head" --method POST \
              -f context=publication-policy -f state=pending \
              -f description='Publication audit required.' > /dev/null
          fi
          ref=$(gh api "repos/$GH_REPO" --jq .default_branch)
          sha=$(gh api "repos/$GH_REPO/commits/$ref" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Read trusted policy code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Test policy checker
        id: tests
        run: node --test .github/scripts/publication-policy.test.mjs
      - name: Audit published material
        if: always() && steps.trusted.outcome == 'success' && steps.checkout.outcome == 'success'
        env:
          PUBLICATION_DENY_PATTERN: ${{ secrets.PUBLICATION_DENY_PATTERN }}
          POLICY_TESTS_PASSED: ${{ steps.tests.outcome == 'success' }}
        run: node .github/scripts/run-publication-policy.mjs
