# Rust Secure Mapping Vault 작업 공간.
[workspace]
resolver = "3"
members = ["crates/prompt-airlock-vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
# unsafe 는 금지한다. win_sec(Windows 보안 설명자)과 alloc(지우는 할당기) 두 모듈만 모듈 단위로 허용한다.
unsafe_code = "deny"

[profile.release]
debug = 1
